<html>
    <head>
        <title>My hobby cards</title>
        
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <style>
        body{
            background-color: rgb(173, 215, 252);
            padding: 30px 15px;

        }
        h1{
            text-align: center;
            color: rgb(111, 125, 248);
        }
        .hobby-card{
            text-align: center;
            background-color: rgb(89, 191, 250);
            border: 2px solid blue;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .hobby-card{
            color: aqua;
        }
    </style>
</head>
    <body>
        <h1>My hobby card</h1>

        <div class="container">
            <div class="row">

                <div class="col-12 col-md-6 col-lg-4">
                    <div class="hobby-card">
                        <h3>Swimming</h3>
                        <p>Swimming makes me feel free underwater</p>
                    </div>
                </div>

                  <div class="col-12 col-md-6 col-lg-4">
                    <div class="hobby-card">
                        <h3>Football</h3>
                        <p>Football makes me feel a special kind of bond between it</p>
                    </div>
                </div>

                  <div class="col-12 col-md-6 col-lg-4">
                    <div class="hobby-card">
                        <h3>Karate</h3>
                        <p>Karate makes me feel strong</p>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
